[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pykhinsider"
version = "0.1.0"
description = "Monitor an inbox folder of music and format, convert, and import the contents into your library."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Fenway Powers" }
]

dependencies = []

[project.scripts]
musicinbox = "musicinbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
